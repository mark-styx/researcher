version: 2

builds:
  - main: ./cmd/researchguy
    binary: researchguy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/marklubin/researchguy/cmd/researchguy.Version={{.Version}}

archives:
  - format: tar.gz

checksum:
  name_template: checksums.txt
